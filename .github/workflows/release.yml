name: Build and Attach Plugin Zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get release info
      id: info
      run: |
        echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        echo "repo_name=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
        
    - name: Create plugin directory
      run: |
        mkdir -p build
        mkdir -p build/${{ steps.info.outputs.repo_name }}
        
    - name: Copy plugin files
      run: |
        # Copy all files except those we want to exclude
        rsync -av --progress . build/${{ steps.info.outputs.repo_name }}/ \
          --exclude='.git*' \
          --exclude='node_modules' \
          --exclude='vendor' \
          --exclude='build' \
          --exclude='.github' \
          --exclude='.claude' \
          --exclude='*.md' \
          --exclude='composer.json' \
          --exclude='composer.lock' \
          --exclude='package.json' \
          --exclude='package-lock.json' \
          --exclude='yarn.lock' \
          --exclude='.DS_Store' \
          --exclude='Thumbs.db' \
          --exclude='.env*' \
          --exclude='*.log' \
          --exclude='tests' \
          --exclude='phpunit.xml*' \
          --exclude='.phpcs.xml*' \
          --exclude='phpstan.neon*' \
          --exclude='phpstan-bootstrap.php' \
          --exclude='webpack.config.js' \
          --exclude='gulpfile.js' \
          --exclude='src' \
          --exclude='assets/src' \
          --exclude='docker-compose.yml' \
          --exclude='Dockerfile' \
          --exclude='.vscode' \
          --exclude='.idea'
          
    - name: Create zip file
      run: |
        cd build
        zip -r "../${{ steps.info.outputs.repo_name }}.zip" ${{ steps.info.outputs.repo_name }}/
        
    - name: Upload release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ steps.info.outputs.tag_name }}" "./${{ steps.info.outputs.repo_name }}.zip" --clobber
